# nginx-gateway 全局配置
# 约束：
#   - conf.d/ 归镜像所有，禁止整目录覆盖挂载。
#   - sites/ 归部署所有，运行时只读挂载。
#   - 全局只做 http 级策略，server 只出现在 conf.d/00-health.conf 和 sites/。
#   - 站点日志默认走 stdout/stderr；需要审计的站点再写 /www/wwwlogs。

user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$request_id '
                    'up=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    # Docker 用户自定义网络内置 DNS；容器重建换 IP 后靠 resolve 自动更新。
    # 禁止在 network_mode: host 下复用本镜像。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites/*.conf;
}

# 需要 TCP/UDP 代理时启用；官方 1.30 镜像已带 --with-stream。
# 站点级 stream 配置放 /etc/nginx/streams/*.conf，运行时只读挂载。
stream {
    include /etc/nginx/stream.d/*.conf;
    include /etc/nginx/streams/*.conf;
}
