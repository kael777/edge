# http 级公共策略。
# 只允许放 limit_req_zone / proxy_cache_path / geo / map 这类 http 指令。
# 禁止在这里写 server { }；业务 server 一律放 sites/。
#
# 示例（按需取消注释）：
# limit_req_zone $binary_remote_addr zone=global_per_ip:10m rate=20r/s;
# proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=global_cache:10m max_size=1g inactive=10m use_temp_path=off;
