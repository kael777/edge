# 普通 HTTP 反代公共头。
# 站点 location 里 include 本文件；WebSocket/SSE 再追加 websocket.conf 覆盖 Connection。
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# proxy_read_timeout 用 nginx 默认 60s；WebSocket/SSE 由 websocket.conf 覆盖为 86400s。
# 不要在这里和 websocket.conf 同时写，否则 nginx 会报 duplicate directive。
